name: Build Android APK from tracked source
on:
  push:
    branches: [main, audit/v145-source-recovery]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-driven asset tree
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -d app/src/main/assets/media
          test -s app/src/main/res/drawable/ic_launcher.png
          if test -f app/src/main/assets/GHC_Study_v1.4.5_FULL_Standalone_Consolidated_Study_Cards.apk; then
            echo 'Legacy APK must not be present in tracked application assets' >&2
            exit 1
          fi
          echo "Tracked media files: $(find app/src/main/assets/media -type f | wc -l)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add trophy terminology study card
        run: python3 scripts/integrate_trophy_card.py
      - name: Verify assembled vocabulary quiz\n        run: python3 scripts/test_vocabulary_assembly.py\n      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged HTML, media and icon
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/media/'
          unzip -l "$APK" | grep -q 'res/drawable/ic_launcher.png'
          if unzip -Z1 "$APK" | grep -q 'GHC_Study_v1.4.5_FULL_Standalone_Consolidated_Study_Cards.apk'; then
            echo 'Legacy APK accidentally embedded' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GHC-Study-v1.4.5-source-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
