name: Audit recovered v1.4.5 against historical APK
on:
  push:
    branches: [audit/v145-source-recovery]
    paths:
      - '.github/workflows/audit-baseline.yml'
      - 'scripts/audit_baseline.py'
      - 'app/src/main/assets/**'
      - 'app/src/main/res/drawable/ic_launcher.png'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover immutable reference APK from historical commit
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=9ce4b3037af3b1a9af5f88ef645265bb06d6f245
          APK=app/src/main/assets/GHC_Study_v1.4.5_FULL_Standalone_Consolidated_Study_Cards.apk
          mkdir -p build/baseline
          git cat-file -e "$BASELINE:$APK"
          git show "$BASELINE:$APK" > "build/baseline/reference.apk"
          unzip -tq build/baseline/reference.apk | tail -1
      - name: Verify every tracked source asset against baseline
        run: |
          python3 scripts/audit_baseline.py --apk build/baseline/reference.apk --assets app/src/main/assets --compare --manifest build/baseline-asset-manifest.json
      - name: Verify launcher icon bytes
        shell: bash
        run: |
          set -euo pipefail
          unzip -p build/baseline/reference.apk res/drawable/ic_launcher.png > build/baseline/reference-icon.png
          cmp build/baseline/reference-icon.png app/src/main/res/drawable/ic_launcher.png
          echo 'Launcher icon matches original APK byte-for-byte'
      - name: Verify no nested legacy APK
        run: test ! -f app/src/main/assets/GHC_Study_v1.4.5_FULL_Standalone_Consolidated_Study_Cards.apk
      - name: Upload source audit inventory
        uses: actions/upload-artifact@v4
        with:
          name: ghc-v145-source-parity-report
          path: build/baseline-asset-manifest.json
          if-no-files-found: error
