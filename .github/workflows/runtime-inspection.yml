name: Inspect application runtime surfaces
on:
  push:
    branches: [audit/v145-source-recovery]
    paths:
      - 'scripts/inspect_runtime_surfaces.py'
      - 'scripts/test_android_back.py'
      - 'app/src/main/java/org/ghcstudy/offline/MainActivity.java'
      - '.github/workflows/runtime-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect navigation and persistence implementation
        run: python3 scripts/inspect_runtime_surfaces.py
      - name: Inspect study card integration points
        run: python3 scripts/inspect_study_integration.py
      - name: Test Android Back transitions against Java embedded script
        run: python3 scripts/test_android_back.py
