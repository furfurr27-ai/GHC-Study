plugins { id 'com.android.application' }
android {
 namespace 'org.ghcstudy.offline'
 compileSdk 35
 defaultConfig {
  applicationId project.hasProperty('ghcStandalone') ? 'org.ghcstudy.v146.standalone' : 'org.ghcstudy.v141'
  manifestPlaceholders = [ghcAppLabel: project.hasProperty('ghcStandalone') ? 'Jäger Field Guide Standalone' : 'Jäger Field Guide']
  minSdk 24
  targetSdk 35
  versionCode 160
  versionName '1.6.0'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
