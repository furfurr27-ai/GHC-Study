<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Abschussplan — visual explanation of a prospective Hessian roe-deer harvest plan</title>
<desc id="desc">New educational illustration based on official Hessian Anlage 2b information: hunting district, planning period, past harvest figures, proposed male and female roe-deer cull and authority decision. Blank fields contain no real plan, quotas or fabricated totals. This is not a usable official form.</desc>
