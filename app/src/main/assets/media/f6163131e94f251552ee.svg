<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img"><style>text{font-family:system-ui,Arial,sans-serif;fill:#2b2b25}.t{font-size:28px;font-weight:700}.s{font-size:20px}.line{stroke:#2b2b25;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#2b2b25;stroke-width:4;fill:none}.fill{fill:#ddd4bb;stroke:#2b2b25;stroke-width:4}.accent{fill:#efe8d4;stroke:#2b2b25;stroke-width:4}</style><text x="115" y="45" class="t">Gauge number is inverse to bore size</text><circle class="fill" cx="255" cy="200" r="105"/><text x="213" y="215" class="t">12</text><circle class="fill" cx="570" cy="200" r="78"/><text x="535" y="215" class="t">20</text><text x="175" y="340" class="s">12 gauge = larger bore</text><text x="505" y="340" class="s">20 gauge = smaller bore</text></svg>